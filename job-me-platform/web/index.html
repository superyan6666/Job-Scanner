<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Job Me 投放平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">🚀</span>
          <div>
            <h1>Job Me</h1>
            <span class="subtitle">智能简历投放平台</span>
          </div>
        </div>
        <div class="connection-status" id="connectionStatus">
          <span class="dot"></span>
          <span id="statusText">连接中...</span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="card stats-grid">
        <div class="stat-card" id="statToday">
          <div class="stat-value" id="todayCount">0</div>
          <div class="stat-label">今日投递</div>
        </div>
        <div class="stat-card" id="statTotal">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">累计投递</div>
        </div>
        <div class="stat-card" id="statSession">
          <div class="stat-value" id="sessionCount">0</div>
          <div class="stat-label">本轮投递</div>
        </div>
        <div class="stat-card" id="statProgress">
          <div class="stat-value" id="progressPct">0%</div>
          <div class="stat-label">完成度</div>
        </div>
      </section>

      <section class="card control-section">
        <div class="section-header">
          <h2>🎮 控制中心</h2>
        </div>
        <div class="platform-selector">
          <label class="platform-label">平台</label>
          <div class="platform-btns">
            <button class="platform-btn active" data-platform="boss">BOSS直聘</button>
            <button class="platform-btn" data-platform="zhilian">智联招聘</button>
            <button class="platform-btn" data-platform="job51">前程无忧</button>
            <button class="platform-btn" data-platform="liepin">猎聘</button>
          </div>
        </div>
        <div class="filters-row">
          <div class="filter-group">
            <label>包含关键词</label>
            <input type="text" id="filterKeywords" placeholder="财务,会计" value="财务,会计">
          </div>
          <div class="filter-group">
            <label>排除关键词</label>
            <input type="text" id="filterExclude" placeholder="外包,培训">
          </div>
          <div class="filter-group">
            <label>投递上限</label>
            <input type="number" id="maxDelivery" value="50" min="1" max="150">
          </div>
        </div>
        <div class="control-btns">
          <button class="btn btn-primary" id="btnStart">▶ 启动自动化</button>
          <button class="btn btn-danger" id="btnStop" disabled>■ 停止</button>
          <button class="btn btn-outline" id="btnTestAI">🤖 测试 AI</button>
        </div>
      </section>

      <section class="card log-section">
        <div class="section-header">
          <h2>📋 实时日志</h2>
          <span class="log-count" id="deliveryCountLabel">已投递: 0</span>
        </div>
        <div class="log-container" id="logContainer">
          <div class="log-placeholder">等待操作...</div>
        </div>
      </section>

      <section class="card history-section">
        <div class="section-header">
          <h2>📜 投递历史</h2>
          <button class="btn btn-sm btn-outline" id="btnRefresh">刷新</button>
        </div>
        <div class="table-container">
          <table class="history-table" id="historyTable">
            <thead>
              <tr>
                <th>时间</th>
                <th>职位</th>
                <th>公司</th>
                <th>平台</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="5" class="empty-row">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card ai-section">
        <div class="section-header">
          <h2>🤖 AI 对话测试</h2>
        </div>
        <div class="ai-config-info" id="aiConfigInfo">
          正在检查 AI 配置...
        </div>
        <div class="ai-test-area">
          <textarea id="aiTestInput" placeholder="输入HR的消息，测试AI如何回复..." rows="3"></textarea>
          <div class="ai-actions">
            <button class="btn btn-primary btn-sm" id="btnAiTest">生成回复</button>
            <span class="ai-provider" id="aiProvider"></span>
          </div>
          <div class="ai-reply" id="aiReply"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Job Me Platform v1.0 · 前后端完整系统</p>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
